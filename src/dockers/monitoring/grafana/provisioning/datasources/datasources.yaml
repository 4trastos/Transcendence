apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: https://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: true
    version: 1
    editable: false