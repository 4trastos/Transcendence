[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins

[server]
protocol = https
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
cert_file = /etc/grafana/ssl/grafana.crt
cert_key = /etc/grafana/ssl/grafana.key
enforce_domain = true

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db
max_idle_conn = 2
max_open_conn = 4
busy_timeout = 5000

[analytics]
check_for_updates = true

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[plugins]
allow_loading_unsigned_plugins = grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-lokiexplore-app,grafana-pyroscope-app