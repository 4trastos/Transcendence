global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    scheme: http
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']

  - job_name: 'php'
    static_configs:
      - targets: ['php-fpm-exporter:9253']

  - job_name: 'nginx'
    metrics_path: '/metrics'
    static_configs:
     - targets: ['nginx-exporter:9113']

  - job_name: 'avalanche'
    scheme: https
    metrics_path: '/metrics'
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['avalanche:9650'] 

  - job_name: 'vault'
    scheme: https
    metrics_path: /v1/sys/metrics
    static_configs:
      - targets: ['security:8200']
    authorization:
      credentials_file: /vault/data/prometheus/token.txt
    tls_config:
      ca_file: /etc/vault/tls/ca.crt
      insecure_skip_verify: true

  - job_name: 'elasticsearch'
    scheme: https
    tls_config:
      ca_file: /usr/share/elasticsearch/config/certs/ca/ca.crt
      insecure_skip_verify: false

  - job_name: 'logstash'
    static_configs:
      - targets: ['logstash-exporter:9811']

  - job_name: 'kibana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kibana-exporter:9201']  # Apuntar al exporter, no directamente a Kibana

  - job_name: 'prometheus'
    scheme: http
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'grafana'
    metrics_path: /metrics
    scheme: http
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['grafana:3000']
