input {
  # Logs de backend Node.js por TCP (aplicaciones que envían JSON)
  tcp {
    port => 5000
    codec => json
    type => "nodejs"
  }

  # Logs de microservicios enviados por HTTP
  http {
    port => 8082
    codec => json
  }

  # Logs de acceso de Nginx
  file {
    path => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx-access"
  }

  # Logs de error de Nginx
  file {
    path => "/var/log/nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx-error"
  }

  # Logs locales del backend si se escriben en archivo plano
  file {
    path => "/var/log/backend.log"
    start_position => "beginning"
    codec => json
    type => "nodejs-file"
  }
}

filter {
  # Logs del backend Node.js
  if [type] in ["nodejs", "nodejs-file"] {
    json {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:message}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  # Logs de Nginx (access)
  if [type] == "nginx-access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    }
  }

  # Logs de Nginx (error) → Podrías agregar un grok también si quieres parsearlo
  if [type] == "nginx-error" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:log_level}\] %{GREEDYDATA:message}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  # Metadatos comunes
  mutate {
    add_field => {
      "environment" => "production"
      "project" => "transcendence"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    template => "/usr/share/logstash/pipeline/elasticsearch-template.json"
    template_name => "transcendence"
    user => "logstash_writer"  # Usar el usuario dedicado
    password => "logstash-internal-pwd"  # Usar la contraseña definida
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/elasticsearch/config/certs/ca/ca.crt"  # Ruta al certificado CA
    ilm_enabled => false
    manage_template => false
    timeout => 300
    retry_on_conflict => 3
  }

  stdout {
    codec => rubydebug
  }
}