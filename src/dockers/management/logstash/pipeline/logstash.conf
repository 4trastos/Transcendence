input {
  tcp {
    port => 5000
    codec => json
    type => "nodejs"
  }

  http {
    port => 8082
    codec => json
  }

  file {
    path => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx-access"
  }

  file {
    path => "/var/log/nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx-error"
  }

  file {
    path => "/var/log/backend.log"
    start_position => "beginning"
    codec => json
    type => "nodejs-file"
  }
}

filter {
  # Fastify logs (tipo JSON)
  if [type] in ["nodejs", "nodejs-file"] {
    # Convertir timestamp de epoch a ISO8601
    date {
      match => ["time", "UNIX_MS"]
      target => "@timestamp"
    }

    mutate {
      rename => { "msg" => "message" }
      convert => { "level" => "integer" }
    }

    translate {
      field => "level"
      destination => "log_level_text"
      override => true
      dictionary => {
        "10" => "trace"
        "20" => "debug"
        "30" => "info"
        "40" => "warn"
        "50" => "error"
        "60" => "fatal"
      }
    }
  }

  # Logs de Nginx (access)
  if [type] == "nginx-access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    }
  }

  # Logs de Nginx (error)
    if [type] == "nginx-error" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:log_level}\] %{GREEDYDATA:message}"
      }
    }

    mutate {
      lowercase => ["log_level"]
    }

    translate {
      field => "log_level"
      destination => "log_level_text"
      override => true
      dictionary => {
        "debug" => "debug"
        "info" => "info"
        "notice" => "info"
        "warn" => "warn"
        "error" => "error"
        "crit" => "fatal"
        "alert" => "fatal"
        "emerg" => "fatal"
      }
    }

    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  # Metadatos comunes
  mutate {
    add_field => {
      "environment" => "production"
      "project" => "transcendence"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    template => "/usr/share/logstash/pipeline/elasticsearch-template.json"
    template_name => "transcendence"
    user => "logstash_writer"
    password => "logstash-internal-pwd"
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/elasticsearch/config/certs/ca/ca.crt"
    ilm_enabled => false
    manage_template => false
    timeout => 300
    retry_on_conflict => 3
  }

  stdout {
    codec => rubydebug
  }
}
