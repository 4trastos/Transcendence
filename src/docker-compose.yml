networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  sqlite:   # Base de datos (SQLite)
    build: dockers/sqlite/.
    container_name: sqlite
    image: nouchka/sqlite3  # Imagen de SQLite para acceder a la base de datos
    volumes:
      - sqlite_data:/var/lib/sqlite
    command: sh /var/lib/sqlite/init_db.sh
    networks:
      - transcendence
    restart: on-failure

  backend:    # Backend (Node.js API)
    build: dockers/backend/.
    container_name: app
    working_dir: /usr/src/app
    volumes:
      - backend_data:/usr/src/app/data
      - sqlite_data:/usr/src/app/data
      - sqlite_data:/var/lib/sqlite
    command: npm start
    ports:
      - "3000:3000"
    depends_on:
      - sqlite
      - avalanche
      - security
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_TOKEN=hvs.waEtSPPk0mOklwybXEWQ6Xcc
    networks:
      - transcendence
    restart: unless-stopped

  php:    # Servidor PHP
    build: dockers/php/.
    container_name: php
    image: php:8.1-apache
    volumes:
      - php_data:/var/www/html
      - zap_reports:/zap/reports
    ports:
      - "8080:80"
    networks:
      - transcendence
    depends_on:
      - frontend
    restart: always

  frontend:   # Frontend (TypeScript + Tailwind)
    build: dockers/frontend/.
    container_name: frontend
    image: node:18-alpine
    volumes:
      - frontend_data:/usr/src/app      # Volumen para el código fuente
      - php_data:/usr/src/app/dist   # Comparte los archivos estáticos con PHP
    command: sh -c "npm run build && npx serve dist -l 3001"  # Cambiado a `npm run build` para generar archivos estáticos
    ports:
      - "3001:3001"
    networks:
      - transcendence
    restart: unless-stopped
    depends_on:
      - backend

  avalanche:      # Blockchain (Avalanche)
    build: dockers/blockchain/.
    container_name: blockchain
    volumes:
      - blockchain_data:/avalanchego
      - ./dockers/blockchain/config.json:/avalanchego/config.json
    ports:
      - "9650:9650"   # JSON RPC endpoint
      - "9651:9651"   # P2P port
    command: ["/avalanchego/avalanchego", "--data-dir", "/avalanchego", "--http-host=0.0.0.0"]
    networks:
      - transcendence
    restart: unless-stopped

  security:
    build: dockers/security/.
    container_name: security
    image: softwaresecurityproject/zap-stable
    ports:
      - "8081:8081"  # zap
      - "8200:8200"  # Vault
    environment:
      - ZAP_DAEMON=True
      - ZAP_PORT=8081
      - ZAP_ALLOWED_HOSTS=*
      - VAULT_ADDR=http://0.0.0.0:8200
    volumes:
      - zap_data:/zap/wrk
      - modsec_data:/var/log/apache2
      - zap_reports:/zap/reports
    entrypoint: ["/zap/wrk/entrypoint.sh"]
    networks:
      - transcendence
    restart: unless-stopped

volumes:
  sqlite_data:
    name: sqlite_data
    driver: local
    driver_opts:
      type: none
      device: "$HOME/goinfre/data/sqlite"
      o: bind
  
  backend_data:
    name: backend_data
    driver: local
    driver_opts:
      type: none
      device: "$HOME/goinfre/data/app"
      o: bind
  
  frontend_data:
    name: frontend_data
    driver: local
    driver_opts:
      type: none
      device: "$HOME/goinfre/data/frontend"
      o: bind
  
  blockchain_data:
    name: blockchain_data
    driver: local
    driver_opts:
      type: none
      device: "$HOME/goinfre/data/blockchain"
      o: bind

  php_data:
    name: php_data
    driver: local
    driver_opts:
      type: none
      device: "$HOME/goinfre/data/php"
      o: bind
    
  zap_data:
     name: zap_data
     driver: local
     driver_opts:
       type: none
       device: "$HOME/goinfre/data/security"
       o: bind
  
  zap_reports:
     name: zap_reports
     driver: local
     driver_opts:
       type: none
       device: "$HOME/goinfre/data/security"
       o: bind

  modsec_data:
     name: modsec_data
     driver: local
     driver_opts:
       type: none
       device: "$HOME/goinfre/data/modsecurity"
       o: bind
  