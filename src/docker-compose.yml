version: '3.8'

networks:
  transcendence:
    name: transcendence
    drivers: bridge

services:
  sqlite:   # Base de datos (SQLite)
    build: dockers/sqlite/.
    container_name: sqlite
    image: nouchka/sqlite3  # Imagen de SQLite para acceder a la base de datos (opcional)
    volumes:
      - sqlite_data:/var/lib/sqlite
    command: tail -f /dev/null  # Mantener el contenedor en ejecución
    networks:
      - transcendence

  backend:    # Backend (Node.js API)
    build: dockers/app/.
    container_name: app
    image: node:18-alpine
    working_dir: /usr/src/app
    volumes:
      - backend_data:/usr/src/app
    command: npm start
    ports:
      - "3000:3000"
    depends_on:
      - sqlite
    networks:
      - transcendence

  php:    # Servidor PHP (para componentes que aún lo requieran)
    build: dockers/php/.
    container_name: php
    image: php:8.1-fpm
    volumes:
      - php_data:/var/www/html
    networks:
      - transcendence

  frontend:   # Frontend (TypeScript + Tailwind)
    build: dockers/frontend/.
    container_name: frontend
    image: node:18-alpine
    volumes:
      - frontend_data:/usr/src/app
    command: npm run dev
    ports:
      - "8080:8080" # Puerto donde se servirá el frontend
    networks:
      - transcendence

  avalanche:      # Blockchain (Avalanche)
    build: dockers/blockchain/.
    container_name: blockchain
    image: avaplatform/avalanchego
    volumes:
      - blockchain_data:/root/.avalanchego
    ports:
      - "9650:9650"   # JSON RPC endpoint
      - "9651:9651"   # P2P port
    networks:
      - transcendence

  zap:    # Cyberseguridad (OWASP ZAP o similar)
    build: dockers/security/.
    container_name: security
    image: owasp/zap2docker-stable
    ports:
      - "8081:8081"
    networks:
      - transcendence   # Puerto para interfaz web de ZAP

volumes:
  sqlite_data:
    name: sqlite_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/sqlite"
      o: bind
  
  backend_data:
    name: backend_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/app"
      o: bind

  php_data:
    name: php_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/php"
      o: bind
  
  frontend_data:
    name: frontend_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/frontend"
      o: bind

  blockchain_data:
    name: blockchain_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/blockchain"
      o: bind

  zap_data:
    name: zap_data
    driver: local
    driver_opts:
      type: none
      device: "home/davgalle/data/security"
      o: bind